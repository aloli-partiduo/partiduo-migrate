de:
  migrate:
    rolled_back: "Übernahme abgebrochen: Die Instanz wurde nicht verändert."
    error: "%{field}: %{message}"
    cli:
      usage: |-
        Aufruf: partiduo-migrate <Befehl> [Optionen]

        Befehle:
          import      übernimmt einen Mandanten in die Instanz von DATABASE_URL (neue Instanz)
          check       prüft eine Quelle und berechnet ihre Zahlen, ohne etwas zu schreiben
          export-fec  schreibt den FEC einer Ursprungsdatenbank (DBVERSION %{dbversion})

        Quellen (import, check):
          --fec DATEI            FEC-Buchungsdatei (Tabulator oder senkrechter Strich)
          --legacy-db URL          Ursprungsdatenbank, über Unix-Socket: postgres:///dossier?host=/tmp
          --encoding NAME        Kodierung des FEC (utf-8, iso-8859-15, windows-1252); Standard: erkannt

        Übernahme (import):
          --report VERZEICHNIS   Verzeichnis des Abstimmungsberichts (Standard rapport-reprise)
          --as-of JJJJ-MM-TT     Stichtag der Altersstrukturliste (Standard: Abschluss des FEC)
          --fiscal-start MM      erster Monat der für einen FEC angelegten Geschäftsjahre (Standard: nach dem Namen)
          --dry-run              Probelauf: alles wird ausgeführt und dann zurückgenommen
          --strict               auch eine Warnung (Stammsatz, USt., Anhang) führt zum Abbruch

        Export (export-fec):
          --output VERZEICHNIS|DATEI   Standard: aktuelles Verzeichnis, vorgeschriebener Name SIRENFECAAAAMMJJ.txt
          --separator tab|pipe       Standard tab
          --out-encoding NAME        Standard iso-8859-15
          --siren NUMMER             Standard: Einstellungen des Ursprungsmandanten

        Alle Befehle:
          --locale SPRACHE       Sprache der Meldungen und des Berichts (%{locales}); Standard fr
