es:
  migrate:
    rolled_back: "Migración anulada: la instancia no se ha modificado."
    error: "%{field}: %{message}"
    cli:
      usage: |-
        Uso: partiduo-migrate <comando> [opciones]

        Comandos:
          import      migra un expediente a la instancia de DATABASE_URL (instancia nueva)
          check       controla un origen y calcula sus cifras, sin escribir nada
          export-fec  escribe el FEC de una base de datos de origen (DBVERSION %{dbversion})

        Orígenes (import, check):
          --fec FICHERO          fichero de asientos contables (tabulación o barra vertical)
          --legacy-db URL          base de datos de origen, por socket Unix: postgres:///dossier?host=/tmp
          --encoding NOMBRE      codificación del FEC (utf-8, iso-8859-15, windows-1252); por defecto: reconocida

        Migración (import):
          --report CARPETA       carpeta del informe de conciliación (por defecto rapport-reprise)
          --as-of AAAA-MM-DD     fecha de referencia de la antigüedad de saldos (por defecto: cierre del FEC)
          --fiscal-start MM      primer mes de los ejercicios creados para un FEC (por defecto: según el nombre)
          --dry-run              prueba en blanco: se hace todo y después se anula
          --strict               una advertencia (ficha, IVA, adjunto) también provoca el fallo

        Exportación (export-fec):
          --output CARPETA|FICHERO   por defecto: carpeta actual, nombre reglamentario SIRENFECAAAAMMJJ.txt
          --separator tab|pipe       por defecto tab
          --out-encoding NOMBRE      por defecto iso-8859-15
          --siren NÚMERO             por defecto: parámetros del expediente de origen

        Todos los comandos:
          --locale IDIOMA        idioma de los mensajes y del informe (%{locales}); por defecto fr
