pt:
  migrate:
    rolled_back: "Migração anulada: a instância não foi alterada."
    error: "%{field}: %{message}"
    cli:
      usage: |-
        Utilização: partiduo-migrate <comando> [opções]

        Comandos:
          import      migra um dossier para a instância de DATABASE_URL (instância nova)
          check       verifica uma origem e calcula os seus números, sem escrever nada
          export-fec  escreve o FEC de uma base de dados de origem (DBVERSION %{dbversion})

        Origens (import, check):
          --fec FICHEIRO         ficheiro francês dos lançamentos contabilísticos (separado por tabulação ou barra vertical)
          --legacy-db URL          base de dados de origem, por socket Unix: postgres:///dossier?host=/tmp
          --encoding NOME        codificação do FEC (utf-8, iso-8859-15, windows-1252); predefinição: reconhecida

        Migração (import):
          --report PASTA         pasta do relatório de reconciliação (predefinição rapport-reprise)
          --as-of AAAA-MM-DD     data de referência da antiguidade de saldos (predefinição: encerramento do FEC)
          --fiscal-start MM      primeiro mês dos exercícios criados para um FEC (predefinição: deduzido do nome)
          --dry-run              simulação: tudo é feito e depois anulado
          --strict               um aviso (ficha, IVA, anexo) também provoca a falha

        Exportação (export-fec):
          --output PASTA|FICHEIRO    predefinição: pasta atual, nome regulamentar SIRENFECAAAAMMDD.txt
          --separator tab|pipe       predefinição tab
          --out-encoding NOME        predefinição iso-8859-15
          --siren NÚMERO             predefinição: parâmetros do dossier de origem

        Todos os comandos:
          --locale IDIOMA        idioma das mensagens e do relatório (%{locales}); predefinição fr
