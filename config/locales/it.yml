it:
  migrate:
    rolled_back: "Migrazione annullata: l'istanza non è stata modificata."
    error: "%{field}: %{message}"
    cli:
      usage: |-
        Uso: partiduo-migrate <comando> [opzioni]

        Comandi:
          import      migra un dossier nell'istanza di DATABASE_URL (istanza nuova)
          check       controlla una sorgente e ne calcola le cifre, senza scrivere nulla
          export-fec  scrive il FEC di un database di origine (DBVERSION %{dbversion})

        Sorgenti (import, check):
          --fec FILE             file delle scritture contabili francese (separato da tabulazione o barra verticale)
          --legacy-db URL          database di origine, tramite socket Unix: postgres:///dossier?host=/tmp
          --encoding NOME        codifica del FEC (utf-8, iso-8859-15, windows-1252); predefinita: riconosciuta

        Migrazione (import):
          --report CARTELLA      cartella del rapporto di riconciliazione (predefinita rapport-reprise)
          --as-of AAAA-MM-GG     data di riferimento dello scadenzario per anzianità (predefinita: chiusura del FEC)
          --fiscal-start MM      primo mese degli esercizi creati per un FEC (predefinito: dedotto dal nome)
          --dry-run              prova a vuoto: tutto viene eseguito e poi annullato
          --strict               anche un avviso (scheda, IVA, allegato) fa fallire

        Esportazione (export-fec):
          --output CARTELLA|FILE     predefinito: cartella corrente, nome regolamentare SIRENFECAAAAMMGG.txt
          --separator tab|pipe       predefinito tab
          --out-encoding NOME        predefinita iso-8859-15
          --siren NUMERO             predefinito: parametri del dossier di origine

        Tutti i comandi:
          --locale LINGUA        lingua dei messaggi e del rapporto (%{locales}); predefinita fr
